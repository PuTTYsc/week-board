<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week board</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--slate:#38546E;--paper:#EDEAE7;--coral:#F0524F;--ink:#1F2F3E;--sub:#4A5F73;--pad:clamp(16px,4vw,56px)}
*{box-sizing:border-box}
html{background:var(--slate)}
body{margin:0;min-height:100vh;background:var(--slate);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{width:100%;min-height:100vh}
header{background:var(--paper);padding:20px var(--pad) 14px;text-align:right}
h1{margin:0;font-size:clamp(26px,3.2vw,40px);line-height:1.1;font-weight:700;color:var(--coral);text-transform:uppercase}
header p{margin:6px 0 10px;font-size:14px;color:#2B2B2B}
.nav{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
button{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid rgba(31,47,62,.35);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:rgba(31,47,62,.08)}
button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
main{width:100%;padding:20px var(--pad) 48px}
.dh{font-size:14px;font-weight:700;text-transform:uppercase;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.tag{font-size:11px;background:var(--coral);color:#fff;padding:1px 6px;border-radius:4px;font-weight:400;text-transform:none}
.day{margin:0 0 20px;scroll-margin-top:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.n{background:var(--paper);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.3;display:block;text-decoration:none}
.n b{display:block;font-weight:600}
.n span{font-size:12px;color:var(--sub)}
.now{border-left:3px solid var(--coral);border-radius:0 6px 6px 0}
.t{font:inherit;color:#fff;background:transparent;width:100%;text-align:left;border:1px solid rgba(255,255,255,.55);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center;line-height:1.3;cursor:pointer}
.t:hover{background:rgba(255,255,255,.1)}
.t.done{opacity:.65;text-decoration:line-through}
.bx{width:12px;height:12px;border:1.5px solid #fff;border-radius:3px;flex:none}
.dn{width:12px;height:12px;border-radius:3px;flex:none;background:#fff;color:var(--slate);font-size:9px;line-height:12px;text-align:center}
.em{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;padding:0 0 8px;border-bottom:.5px solid rgba(255,255,255,.25);scroll-margin-top:12px}
.em .dh{margin:0}.em span{font-size:12px;color:rgba(255,255,255,.6)}
.msg{text-align:center;padding:48px 16px}
.msg p{margin:0 0 16px;font-size:15px}
.msg button{color:#fff;border-color:rgba(255,255,255,.6);font-size:15px;padding:10px 18px}
.msg button:hover{background:rgba(255,255,255,.12)}
#err{color:#FFD2D0}
.left{display:none}
.dt{display:block}
.btn{font:inherit;font-size:13px;display:inline-block;text-decoration:none;background:var(--coral);color:#fff;border:1px solid var(--coral);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{opacity:.9;background:var(--coral)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,520px);background:var(--ink);color:#fff;border:1px solid rgba(255,255,255,.3);padding:10px 14px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
dialog{background:var(--slate);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 16px;font-size:20px;text-transform:uppercase}
dialog label{display:block;font-size:13px;margin:0 0 14px}
dialog input{display:block;width:100%;margin-top:6px;padding:10px;font:inherit;font-size:16px;color:#fff;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.4);border-radius:6px;color-scheme:dark}
dialog input:focus-visible{outline:2px solid var(--coral);outline-offset:1px}
dialog .row{display:flex;gap:8px;justify-content:flex-end}
dialog .row button:not(.btn){color:#fff;border-color:rgba(255,255,255,.5)}
#tke{margin:0 0 12px;font-size:13px;color:#FFD2D0;min-height:0}
@media (min-width:1100px){
header{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;padding-top:18px;padding-bottom:16px}
h1{font-size:clamp(24px,2.4vw,34px)}
.dt{display:inline;margin-left:.45em}
.dt::before{content:"·";margin-right:.45em}
#sum{display:none}
.nav{margin-top:0;flex-wrap:nowrap}
.left{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;text-align:left;max-width:62ch}
.left h2{margin:0;font-size:clamp(24px,2.4vw,34px);line-height:1.1;font-weight:700;color:var(--ink);text-transform:uppercase}
.left p{margin:0;font-size:clamp(16px,1.4vw,19px);line-height:1.4;color:#2B2B2B;padding-bottom:2px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
main{display:grid;grid-template-columns:var(--cols,repeat(7,minmax(0,1fr)));gap:14px;align-items:stretch}
main .msg{grid-column:1/-1}
.day,.em{margin:0;background:rgba(0,0,0,.16);border-radius:8px;padding:12px;border-top:3px solid transparent;min-width:0}
.em{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;border-bottom:0}
.em span{font-size:12px}
[data-today]{border-top-color:var(--coral)}
.g{grid-template-columns:1fr}
.dh{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="left"><h2 id="greet"></h2><p id="lede"></p></div>
<div class="right">
<h1 id="h1">This week</h1>
<p id="sum">&nbsp;</p>
<div class="nav" id="nav" hidden>
<button id="prev" aria-label="Previous week">Previous</button>
<button id="today">Today</button>
<button id="next" aria-label="Next week">Next</button>
<a class="btn" id="addEv" href="https://calendar.google.com/calendar/r/eventedit" target="_blank" rel="noopener">Add event</a>
<button type="button" class="btn" id="addTk">Add task</button>
<button id="out">Sign out</button>
</div>
</div>
</header>
<main id="main">
<div class="msg"><p>See your Google Calendar events and tasks for the week on one board.</p><button id="in">Sign in with Google</button><p id="err"></p></div>
</main>
</div>
<dialog id="tkd">
<form id="tkf">
<h2>Add task</h2>
<label>Title<input id="tkt" required maxlength="500" autocomplete="off"></label>
<label>Due date<input id="tkdte" type="date" required></label>
<p id="tke" role="alert"></p>
<div class="row"><button type="button" id="tkx">Cancel</button><button type="submit" class="btn" id="tks">Add task</button></div>
</form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const CLIENT_ID="67472366673-3negm5irict0ovr8a5mrisibjeto2em2.apps.googleusercontent.com";
const SCOPES="https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks";
const $=id=>document.getElementById(id);
let token=null,tc=null,cur=null,silent=false,weekStart=sunday(new Date());
function sunday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(d){return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}).toLowerCase()}
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{Authorization:"Bearer "+token,...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(r.status===401){token=null;localStorage.removeItem("wb_in");throw new Error("Your session expired. Sign in again.")}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||"Google returned an error ("+r.status+")")}
  return r.json();
}
function init(){
  if(!window.google||!google.accounts){setTimeout(init,150);return}
  tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:r=>{
    const quiet=silent;silent=false;
    if(r.error){if(!quiet&&$("err"))$("err").textContent="Sign-in didn't complete. Try again.";return}
    token=r.access_token;localStorage.setItem("wb_in","1");load(true);
  }});
  if(localStorage.getItem("wb_in")){silent=true;tc.requestAccessToken({prompt:""})}
}
$("in").onclick=()=>{if(tc){silent=false;tc.requestAccessToken({prompt:"consent"})}};
$("out").onclick=()=>{if(token)google.accounts.oauth2.revoke(token);token=null;localStorage.removeItem("wb_in");location.reload()};
$("prev").onclick=()=>{weekStart.setDate(weekStart.getDate()-7);load(false)};
$("next").onclick=()=>{weekStart.setDate(weekStart.getDate()+7);load(false)};
$("today").onclick=()=>{weekStart=sunday(new Date());load(true)};
async function load(scroll){
  $("nav").hidden=false;
  $("main").innerHTML='<div class="msg"><p>Loading your week…</p></div>';
  const end=new Date(weekStart);end.setDate(end.getDate()+7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return {d,k:key(d),ev:[],tk:[]}});
  const idx=Object.fromEntries(days.map(x=>[x.k,x]));
  try{
    const cl=(await api("https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader")).items;
    const pr=cl.find(c=>c.primary);if(pr)setLinks(pr.id);
    const cals=cl.filter(c=>c.selected!==false);
    const q="?singleEvents=true&orderBy=startTime&maxResults=250&timeMin="+encodeURIComponent(weekStart.toISOString())+"&timeMax="+encodeURIComponent(end.toISOString());
    const evs=await Promise.all(cals.map(c=>api("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(c.id)+"/events"+q).then(r=>r.items||[])));
    evs.flat().forEach(e=>{
      if(e.status==="cancelled")return;
      if(e.start.date){
        const s=new Date(e.start.date+"T00:00"),f=new Date(e.end.date+"T00:00");
        for(let d=new Date(s);d<f;d.setDate(d.getDate()+1)){const x=idx[key(d)];if(x)x.ev.push({t:e.summary||"(No title)",time:"All day",sort:-1,u:e.htmlLink})}
      }else{
        const s=new Date(e.start.dateTime),x=idx[key(s)];
        if(x)x.ev.push({t:e.summary||"(No title)",time:fmt(s),sort:s.getTime(),u:e.htmlLink});
      }
    });
    const lists=(await api("https://tasks.googleapis.com/tasks/v1/users/@me/lists")).items||[];
    const dmin=key(weekStart)+"T00:00:00Z";
    const last=new Date(end);last.setDate(last.getDate()-1);
    const dmax=key(last)+"T23:59:59Z";
    const tks=await Promise.all(lists.map(l=>api("https://tasks.googleapis.com/tasks/v1/lists/"+l.id+"/tasks?showCompleted=true&showHidden=true&maxResults=100&dueMin="+encodeURIComponent(dmin)+"&dueMax="+encodeURIComponent(dmax)).then(r=>(r.items||[]).map(t=>({...t,_l:l.id})))));
    tks.flat().forEach(t=>{if(!t.due||!t.title)return;const x=idx[t.due.slice(0,10)];if(x)x.tk.push({t:t.title,done:t.status==="completed",id:t.id,l:t._l})});
    render(days);
    if(scroll){const el=document.querySelector("[data-today]");if(el)el.scrollIntoView({block:"start"})}
  }catch(e){
    $("main").innerHTML='<div class="msg"><p id="err">'+esc(e.message)+'</p><button id="retry">'+(token?"Retry":"Sign in with Google")+'</button></div>';
    $("retry").onclick=()=>token?load(false):tc.requestAccessToken({prompt:"consent"});
  }
}
function render(days){
  cur=days;
  const tk=key(new Date());
  const first=days[0].d,last=days[6].d;
  const mo=d=>d.toLocaleDateString("en-US",{month:"short"}).toUpperCase();
  const ttl=weekStart.getTime()===sunday(new Date()).getTime()?"This week":"Week of";
  $("h1").innerHTML=ttl+'<span class="dt">'+first.getDate()+" "+mo(first)+" – "+last.getDate()+" "+mo(last)+"</span>";
  const ne=days.reduce((a,x)=>a+x.ev.length,0),nt=days.reduce((a,x)=>a+x.tk.filter(t=>!t.done).length,0);
  $("sum").textContent=ne+" event"+(ne===1?"":"s")+" · "+nt+" task"+(nt===1?"":"s")+" open";
  $("lede").textContent="You have "+(ne?ne+" event"+(ne===1?"":"s"):"no events")+" and "+(nt?nt+" open task"+(nt===1?"":"s"):"no open tasks")+".";
  $("main").innerHTML=days.map(x=>{
    const isT=x.k===tk;
    const lab=x.d.toLocaleDateString("en-US",{weekday:"short"})+" "+x.d.getDate();
    const tag=isT?'<span class="tag">today</span>':"";
    if(!x.ev.length&&!x.tk.length)return '<div class="em"'+(isT?" data-today":"")+'><p class="dh">'+lab+tag+'</p><span>Nothing scheduled</span></div>';
    x.ev.sort((a,b)=>a.sort-b.sort);
    const evs=x.ev.map(e=>'<a class="n'+(isT?" now":"")+'" href="'+esc(e.u)+'" target="_blank" rel="noopener"><b>'+esc(e.t)+'</b><span>'+e.time+'</span></a>').join("");
    const tks=x.tk.map(t=>'<button type="button" class="t'+(t.done?" done":"")+'" data-l="'+esc(t.l)+'" data-i="'+esc(t.id)+'" aria-pressed="'+t.done+'"><span class="'+(t.done?"dn":"bx")+'">'+(t.done?"✓":"")+'</span>'+esc(t.t)+'</button>').join("");
    return '<section class="day"'+(isT?" data-today":"")+'><p class="dh">'+lab+tag+'</p><div class="g">'+evs+tks+'</div></section>';
  }).join("");
  $("main").style.setProperty("--cols",days.map(x=>(x.ev.length||x.tk.length)?"minmax(0,1fr)":"minmax(0,.6fr)").join(" "));
}
let tt;
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),5000)}
function setLinks(a){
  const q=a?"authuser="+encodeURIComponent(a):"";
  $("addEv").href="https://calendar.google.com/calendar/r/eventedit"+(q?"?"+q:"");
}
async function toggle(l,i){
  let tk=null;cur.forEach(x=>x.tk.forEach(t=>{if(t.id===i&&t.l===l)tk=t}));
  if(!tk||tk.busy)return;
  const was=tk.done;tk.done=!was;tk.busy=true;render(cur);
  try{
    await api("https://tasks.googleapis.com/tasks/v1/lists/"+encodeURIComponent(l)+"/tasks/"+encodeURIComponent(i),{method:"PATCH",body:JSON.stringify(was?{status:"needsAction",completed:null}:{status:"completed"})});
  }catch(e){
    tk.done=was;render(cur);
    toast(/insufficient|permission|scope|403/i.test(e.message)?"Google didn't allow that change. Sign out, then sign in again to grant task access.":"Couldn't update that task. "+e.message);
  }
  tk.busy=false;
}
$("main").onclick=e=>{const b=e.target.closest(".t");if(b&&cur)toggle(b.dataset.l,b.dataset.i)};
$("addTk").onclick=()=>{$("tkt").value="";$("tkdte").value=key(new Date());$("tke").textContent="";$("tkd").showModal();$("tkt").focus()};
$("tkx").onclick=()=>$("tkd").close();
$("tkf").onsubmit=async e=>{
  e.preventDefault();
  const title=$("tkt").value.trim(),d=$("tkdte").value;
  if(!title||!d)return;
  $("tks").disabled=true;$("tke").textContent="";
  try{
    const res=await api("https://tasks.googleapis.com/tasks/v1/lists/@default/tasks",{method:"POST",body:JSON.stringify({title,due:d+"T00:00:00.000Z"})});
    $("tkd").close();
    const x=cur&&cur.find(z=>z.k===d);
    if(x){x.tk.push({t:title,done:false,id:res.id,l:"@default"});render(cur);toast("Task added")}
    else toast("Task added for "+d+", which is outside this week");
  }catch(err){
    $("tke").textContent=/insufficient|permission|scope|403/i.test(err.message)?"Google didn't allow that. Sign out, then sign in again to grant task access.":"Couldn't add the task. "+err.message;
  }
  $("tks").disabled=false;
};
function hello(){
  const h=new Date().getHours();
  $("greet").textContent=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  $("lede").textContent="Sign in to see your week.";
}
hello();
init();
</script>
</body>
</html>
